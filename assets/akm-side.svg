<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">AKM 槍械比例校準側面示意</title>
<desc id="desc">依據實機畫面校準前段、機匣與固定槍托比例的 AKM 研究用側視向量圖；非官方 3D 槍模。</desc>
<defs>
<linearGradient id="metal" x1="0" y1="0" x2=".12" y2="1"><stop stop-color="#59605b"/><stop offset=".49" stop-color="#414b48"/><stop offset="1" stop-color="#343d3b"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2=".18" y2="1"><stop stop-color="#8b6446"/><stop offset=".55" stop-color="#725039"/><stop offset="1" stop-color="#593f30"/></linearGradient>
<linearGradient id="mag" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#444d4b"/><stop offset=".52" stop-color="#343c3c"/><stop offset="1" stop-color="#293234"/></linearGradient>
<filter id="ground"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".35"/></filter>
<pattern id="woodFiber" width="96" height="18" patternUnits="userSpaceOnUse"><path d="M-5 5 Q20 1 47 5 T101 4 M-3 12 Q29 9 57 13 T99 11" fill="none" stroke="#d0a581" stroke-width=".7" opacity=".13"/><path d="M0 8 Q30 11 62 7 T100 9" fill="none" stroke="#261f1b" stroke-width=".6" opacity=".22"/></pattern>
<pattern id="steelBrushing" width="9" height="11" patternUnits="userSpaceOnUse"><path d="M0 4 H9 M1 9 H7" fill="none" stroke="#b3beb4" stroke-width=".55" opacity=".09"/></pattern>
</defs>
<g filter="url(#ground)" stroke="#172025" stroke-width="2.8" stroke-linejoin="round">
