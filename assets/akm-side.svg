<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">AKM 高精細側視研究向量圖</title>
<desc id="desc">依 AKM 側視結構與原有 2026 三角洲畫面參考重新描繪之研究示意。包含漸層鋼製槍管、獨立上下木護木、沖壓機匣、握把和槍托。彈匣由另一張同座標 SVG 疊加，非官方遊戲模型。</desc>
<defs>
 <linearGradient id="metal" x1="0" y1="0" x2=".16" y2="1"><stop stop-color="#89938b"/><stop offset=".1" stop-color="#505e57"/><stop offset=".43" stop-color="#303b39"/><stop offset=".78" stop-color="#222c2c"/><stop offset="1" stop-color="#10191a"/></linearGradient>
 <linearGradient id="receiver-tone" x1="0" y1="0" x2=".10" y2="1"><stop stop-color="#596761"/><stop offset=".17" stop-color="#384744"/><stop offset=".55" stop-color="#303d3b"/><stop offset="1" stop-color="#222d2e"/></linearGradient>
 <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6e7c73"/><stop offset=".18" stop-color="#414c48"/><stop offset=".6" stop-color="#2a3434"/><stop offset="1" stop-color="#202a2a"/></linearGradient>
 <linearGradient id="wood" x1=".04" y1="0" x2=".20" y2="1"><stop stop-color="#aa7651"/><stop offset=".2" stop-color="#896040"/><stop offset=".55" stop-color="#754c32"/><stop offset=".87" stop-color="#543522"/><stop offset="1" stop-color="#3a281f"/></linearGradient>
 <linearGradient id="wood-edge" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#b08156"/><stop offset="1" stop-color="#523722"/></linearGradient>
 <pattern id="woodFiber" width="91" height="23" patternUnits="userSpaceOnUse"><path d="M-8 4C14 0 31 8 52 3S87 7 104 1 M-6 11Q21 4 37 10T103 10 M-9 19Q28 24 55 17T106 19" fill="none" stroke="#dfaf7a" stroke-width=".9" opacity=".19"/><path d="M-8 7Q29 13 67 6T111 8 M-10 20Q31 14 56 20T109 17" fill="none" stroke="#281a14" stroke-width="1" opacity=".29"/></pattern>
 <pattern id="steelBrushing" width="13" height="9" patternUnits="userSpaceOnUse"><path d="M0 2H13 M4 6H10" fill="none" stroke="#bccac0" stroke-width=".45" opacity=".11"/></pattern>
 <filter id="ground" x="-5%" y="-11%" width="110%" height="132%"><feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity=".44"/></filter>
</defs>
<g filter="url(#ground)" stroke-linecap="round" stroke-linejoin="round">
