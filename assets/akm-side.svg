 <circle cx="620" cy="193" r="3" fill="#bac5ad" stroke="#1a2623" stroke-width="1.5"/>
 <circle cx="376" cy="198" r="2.8" fill="#b4bbaa" stroke="#0e1818" stroke-width="1.6"/>
