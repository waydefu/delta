 <circle cx="649" cy="227" r="2.6" fill="#849b8c" stroke="#101819" stroke-width="1.4"/>
 <!-- magazine well matches independent layer anchoring at x458..550 -->
 <path d="M451 235L552 236L549 251L458 251Z" fill="#263230" stroke="#141c1c" stroke-width="2.7"/>
 <path d="M458 250H548" stroke="#6c8274" stroke-opacity=".56" stroke-width="1.7"/>
 <!-- trigger and curved trigger guard -->
 <path d="M574 238L641 239Q654 262 630 273L603 268L585 249" fill="none" stroke="#b1a38a" stroke-width="4"/>
 <path d="M589 244Q595 263 611 262Q616 259 614 247" fill="none" stroke="#1c2425" stroke-width="4"/>
 <path d="M586 256L609 264" stroke="#788676" stroke-width="1.4"/>
 <!-- pistol grip: narrowed profile rather than rectangular diagonal block -->
 <path d="M620 238Q640 233 651 244Q669 268 677 299L694 334Q685 347 671 350L639 343Q625 327 614 301L589 263L598 241Z" fill="url(#wood)" stroke="#11191b" stroke-width="3.2"/>
 <path d="M620 238Q640 233 651 244Q669 268 677 299L694 334Q685 347 671 350L639 343Q625 327 614 301L589 263L598 241Z" fill="url(#woodFiber)"/>
 <path d="M610 263Q630 298 647 332L671 342 M625 251Q646 279 658 318" fill="none" stroke="#d4a174" stroke-opacity=".27" stroke-width="1.8"/>
 <path d="M640 342Q667 353 689 335" fill="none" stroke="#211917" stroke-width="3"/>
</g>
<!-- STOCK: thin neck, swept comb, real wood geometry, heel and buttplate -->
<g id="stock-assembly">
 <path d="M673 168Q697 169 723 185L756 195Q778 193 805 188L959 177Q972 176 981 183L985 270Q980 279 965 280L865 274Q817 260 774 247L722 235Q699 233 683 221Z" fill="url(#wood)" stroke="#131a1a" stroke-width="3.6"/>
