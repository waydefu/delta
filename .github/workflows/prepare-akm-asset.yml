name: Research AKM model conversion
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/prepare-akm-asset.yml
      - scripts/inspect-export-akm.py

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Blender Python wheel (no slow Ubuntu apt mirror)
        timeout-minutes: 11
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: bpy==4.5.15 zstandard
          python -c 'import bpy; print("BLENDER_PYTHON", bpy.app.version_string)'
      - name: Download CC0 source and unpack Zstd if present
        timeout-minutes: 5
        run: |
          mkdir -p .model-work model-output
          curl --fail --location --retry 2 --connect-timeout 12 --max-time 220 \
            --proto '=https' --tlsv1.2 \
            -o .model-work/akm54.source \
            https://opengameart.org/sites/default/files/akm54.blend
          python - <<'PY'
          from pathlib import Path
          import hashlib, shutil, zstandard as zstd
          source=Path(".model-work/akm54.source")
          size=source.stat().st_size
          assert 1_000_000<size<70_000_000, ("unexpected download size",size)
          raw=source.read_bytes()
          Path("model-output/download-sha256.txt").write_text(hashlib.sha256(raw).hexdigest()+"  akm54.source\n")
          target=Path(".model-work/akm54.blend")
          if raw.startswith(bytes.fromhex("28b52ffd")):
              with source.open("rb") as inp, target.open("wb") as out:
                  with zstd.ZstdDecompressor().stream_reader(inp) as stream:
                      shutil.copyfileobj(stream,out,length=1024*1024)
          elif raw.startswith(b"BLENDER"):
              target.write_bytes(raw)
          else:
              raise ValueError("Source has unexpected file magic "+raw[:16].hex())
          assert 100_000<target.stat().st_size<300_000_000, "decompressed size outside safe bound"
          with target.open("rb") as handle: assert handle.read(7)==b"BLENDER"
          Path("model-output/source-sha256.txt").write_text(hashlib.sha256(target.read_bytes()).hexdigest()+"  akm54.blend\n")
          print("Blender source valid, length",target.stat().st_size,"version",target.read_bytes()[7:12])
          PY
      - name: Inspect and export GLB without running embedded scripts
        timeout-minutes: 6
        run: |
          AKM_SOURCE="$GITHUB_WORKSPACE/.model-work/akm54.blend" \
          AKM_OUTPUT="$GITHUB_WORKSPACE/model-output" \
          python scripts/inspect-export-akm.py
          test -s model-output/akm.glb
      - name: Validate glTF binary and model provenance report
        run: |
          python - <<'PY'
          import json, pathlib, struct
          p=pathlib.Path("model-output/akm.glb")
          with p.open("rb") as f: header=f.read(12)
          assert header[:4]==b"glTF", "not a GLB"
          assert struct.unpack_from("<I",header,4)[0]==2, "not glTF 2.0"
          assert struct.unpack_from("<I",header,8)[0]==p.stat().st_size, "GLB size mismatch"
          report=json.loads(pathlib.Path("model-output/inspection.json").read_text())
          assert report["meshes"] and report["license"]=="CC0 1.0 Universal", "missing model/provenance"
          assert p.stat().st_size<100_000_000, "too large for web"
          print("P1_MODEL_REVIEW",json.dumps({"bytes":p.stat().st_size,"meshCount":len(report["meshes"]),"parts":report["part_candidates"],"materials":len(report["materials"]),"images":len(report["images"])},ensure_ascii=False))
          PY
      - name: Archive GLB and mesh report for review
        uses: actions/upload-artifact@v4
        with:
          name: akm-cc0-glb-unreviewed
          path: |
            model-output/akm.glb
            model-output/inspection.json
            model-output/source-sha256.txt
            model-output/download-sha256.txt
          if-no-files-found: error
          retention-days: 14
