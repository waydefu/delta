name: P1 real-browser 3D smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/visual-smoke.yml
      - scripts/p1-browser-check.mjs
      - src/**
      - assets/**
      - index.html
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Exercise actual 2D and local GLB on desktop and mobile
        run: node scripts/p1-browser-check.mjs
      - name: Browser evidence screenshots and report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-browser-evidence
          path: browser-evidence/
          if-no-files-found: warn
          retention-days: 10
