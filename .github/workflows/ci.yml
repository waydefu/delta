name: AKM prototype validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check src/app.mjs
          node --check src/gunsmith.mjs
          node --check src/attachment-graph.mjs
          node --check src/data-governance.mjs
          node --check src/visualizations.mjs
          node --check src/details.mjs
          node --check src/measurements.mjs
          node --check src/engine.mjs
          node --check src/motion.mjs
          node --check src/studio-light.mjs
          node --check src/model-reference.mjs
          node --check src/research-catalog.mjs
          node --check src/local-viewer.mjs
      - name: Verify shipped CC0 GLB, textures and SHA256
        run: node scripts/check-akm-model.mjs
      - name: Workflow governance policy
        run: node scripts/governance-check.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
